<svg xmlns="http://www.w3.org/2000/svg" width="466" height="164" viewBox="8 8 466 164" role="img" aria-labelledby="title desc">
  <title id="title">BiletFlow logo</title>
  <desc id="desc">A flowing F-shaped route inside a ticket, beside the BiletFlow wordmark.</desc>
  <g transform="translate(20 20)">
    <rect width="140" height="140" rx="34" fill="#4F46E5"/>
    <!-- Ticket silhouette with the notches cut into the right and left edges -->
    <path fill="#ffffff" d="M37 42 H103 C109 42 114 47 114 53 V59 C107 59 102 64 102 70 C102 76 107 81 114 81 V87 C114 93 109 98 103 98 H37 C31 98 26 93 26 87 V81 C33 81 38 76 38 70 C38 64 33 59 26 59 V53 C26 47 31 42 37 42 Z"/>
    <!-- The two uninterrupted routes form a subtle F -->
    <path d="M50 58 H88 C95 58 96 69 87 70 H50" fill="none" stroke="#4F46E5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 82 H77" fill="none" stroke="#4F46E5" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="185" y="111" fill="#111827" font-family="Inter, DejaVu Sans, sans-serif" font-size="67" font-weight="700" letter-spacing="-3.3">Bilet<tspan fill="#4F46E5">Flow</tspan></text>
</svg>
